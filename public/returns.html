<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Retours - OMS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        .nav a {
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .nav a:hover {
            background: #f0f0ff;
        }
        .nav a.active {
            background: #667eea;
            color: white;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #999;
        }
        .close:hover {
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .return-type-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            color: white;
        }
        .type-return { background: #f39c12; }
        .type-exchange { background: #3498db; }
        .type-refund { background: #e74c3c; }
        .type-gift_card { background: #9b59b6; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 OMS Multi-Platform</h1>
            <p class="subtitle">Gestion des retours</p>
        </header>

        <nav class="nav">
            <a href="/">Commandes</a>
            <a href="/returns.html" class="active">Retours</a>
        </nav>

        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-returns">-</div>
                <div class="stat-label">Retours totaux</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #f39c12 0%, #d68910 100%);">
                <div class="stat-value" id="pending-returns">-</div>
                <div class="stat-label">En attente</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #27ae60 0%, #229954 100%);">
                <div class="stat-value" id="completed-returns">-</div>
                <div class="stat-label">Terminés</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);">
                <div class="stat-value" id="total-refunds">-</div>
                <div class="stat-label">Remboursements</div>
            </div>
        </div>

        <div class="section">
            <h2>Filtres</h2>
            <div class="filters">
                <select id="status-filter" onchange="loadReturns()">
                    <option value="">Tous les statuts</option>
                    <option value="pending">En attente</option>
                    <option value="approved">Approuvé</option>
                    <option value="rejected">Rejeté</option>
                    <option value="processing">En cours</option>
                    <option value="completed">Terminé</option>
                    <option value="cancelled">Annulé</option>
                </select>

                <select id="type-filter" onchange="loadReturns()">
                    <option value="">Tous les types</option>
                    <option value="return">Retour simple</option>
                    <option value="exchange">Échange</option>
                    <option value="refund">Remboursement</option>
                    <option value="gift_card">Bon cadeau</option>
                </select>

                <input type="text" id="search-input" placeholder="Rechercher par n° retour ou email..."
                       onkeyup="handleSearch(event)">
            </div>
        </div>

        <div class="section">
            <h2>Liste des retours</h2>
            <div id="loading" class="loading" style="display: none;">Chargement...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div class="table-container">
                <table id="returns-table">
                    <thead>
                        <tr>
                            <th>N° Retour</th>
                            <th>Type</th>
                            <th>Commande</th>
                            <th>Client</th>
                            <th>Montant</th>
                            <th>Statut</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="returns-tbody">
                        <tr>
                            <td colspan="8" class="no-data">Aucun retour à afficher</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- Modal détails retour -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeDetailModal()">&times;</span>
            <h2>Détails du retour</h2>
            <div id="return-details"></div>
        </div>
    </div>

    <script src="returns.js"></script>
</body>
</html>
